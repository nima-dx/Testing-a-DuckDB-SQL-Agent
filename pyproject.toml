[project]
name = "testing-a-duckdb-sql-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nima Dadkhah", email = "nima.lewagon.de@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "pydantic-ai>=2.54.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
testing-a-duckdb-sql-agent = "testing_a_duckdb_sql_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
